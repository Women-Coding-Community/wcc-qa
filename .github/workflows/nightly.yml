# Nightly run of the whole suite against a fresh copy of the application stack.
#
# The tests need live services, so the job checks out wcc-backend next to this repo (the
# layout `WCC_BACKEND_DIR` defaults to), builds its QA stack with Docker Compose — PostgreSQL,
# MailHog, the backend API and the admin portal; the public website is not needed by any test
# and is skipped — seeds it, and runs `npm test`: the base phase (api, admin), then the
# `@ad-hoc` phase, which switches the mentorship cycle through wcc-backend's app-stack.sh.
#
# Manual runs (Actions → Nightly → Run workflow) can pick a suite and a wcc-backend branch,
# e.g. to check a backend feature branch against the suite before it merges.
name: Nightly

on:
  push:
    branches:
      - 14/github_actions
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC, every day
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [all, api, admin]
        default: all
      backend_ref:
        description: wcc-backend branch, tag or SHA to build the stack from
        type: string
        default: main

env:
  BACKEND_REPO: Women-Coding-Community/wcc-backend
  COMPOSE_FILE: docker/docker-compose.qa.yml
  # Only validated by compose, never built here (no test needs the public website).
  WCC_FRONTEND_CONTEXT: https://github.com/Women-Coding-Community/wcc-frontend.git

jobs:
  nightly:
    # Forks don't run the schedule; they can still trigger it manually.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'Women-Coding-Community/wcc-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out wcc-qa
        uses: actions/checkout@v4
        with:
          path: wcc-qa

      - name: Check out wcc-backend (owns the Docker stack)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ inputs.backend_ref || 'main' }}
          path: wcc-backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: wcc-qa/package-lock.json

      - name: Install dependencies
        working-directory: wcc-qa
        run: npm ci

      - name: Install Playwright browser (admin project runs on Desktop Safari)
        working-directory: wcc-qa
        run: npx playwright install --with-deps webkit

      - name: Build the stack images
        working-directory: wcc-backend
        run: docker compose --file "$COMPOSE_FILE" build springboot-app admin-app seed

      - name: Start the stack
        working-directory: wcc-backend
        run: |
          docker compose --file "$COMPOSE_FILE" up --detach postgres mailhog springboot-app

          # Spring Boot can need longer than the compose healthcheck allows on a shared runner,
          # so wait for the backend here; Docker flips it back to healthy on the next probe.
          for _ in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' springboot-app)" = healthy ] && break
            sleep 5
          done
          docker inspect --format '{{.State.Health.Status}}' springboot-app | grep -q healthy

          docker compose --file "$COMPOSE_FILE" up --detach --wait admin-app

      - name: Seed the QA accounts and the mentorship cycle
        working-directory: wcc-backend
        run: scripts/app-stack.sh seed

      - name: Configure the tests for the local stack
        working-directory: wcc-qa
        run: cp tests/.env.example tests/.env

      - name: Run the tests
        working-directory: wcc-qa
        run: |
          case "${{ inputs.suite || 'all' }}" in
            api)   npm run test:api ;;
            admin) npm run test:admin ;;
            *)     npm test ;;
          esac

      - name: Show stack logs on failure
        if: failure()
        working-directory: wcc-backend
        run: |
          docker compose --file "$COMPOSE_FILE" ps
          docker compose --file "$COMPOSE_FILE" logs --tail 200 springboot-app admin-app

      # The report captures request headers, but only for this throwaway stack: its API key and
      # passwords are the public defaults in tests/.env.example, and the containers are gone when
      # the job ends. Reports from any other environment must not be uploaded.
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: wcc-qa/playwright-report
          retention-days: 7
